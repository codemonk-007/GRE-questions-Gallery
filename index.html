<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRE Verbal Practice Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1>GRE Verbal Practice Gallery</h1>
            <div class="toolbar">
                <span id="image-count" class="count-badge">0 questions</span>
                <button id="download-all-btn" class="btn-primary">
                    <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span>Download All</span>
                </button>
            </div>
        </header>

        <div id="gallery" class="gallery">
            <!-- Images injected by JavaScript -->
        </div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="file-input" accept="image/*" multiple style="position:fixed;left:-9999px;top:-9999px;">

    <!-- Floating Action Button (Upload) -->
    <button id="upload-btn" class="fab" title="Upload image">＋</button>

    <!-- Settings Gear (Token Management) -->
    <button id="settings-btn" class="gear" title="Settings">⚙</button>

    <!-- Modal for full-size viewing -->
    <div id="gallery-modal" class="modal">
        <img id="modal-img" src="" alt="Full size">
    </div>

    <!-- Toast notification -->
    <div id="toast"></div>

    <!-- JSZip for batch download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
