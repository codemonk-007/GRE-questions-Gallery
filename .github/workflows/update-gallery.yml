name: Update Image Manifest

on:
  push:
    paths:
      - 'images/**' # Only run when files are added to the images folder

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate images.json
        run: |
          cd images
          ls -1 | grep -E '\.(png|jpg|jpeg|webp|gif)$' | jq -R -s -c 'split("\n")[:-1]' > ../images.json
          cd ..
          
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add images.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update image manifest"
          git push
